<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口业 · 终</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .scene-save {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            background: linear-gradient(170deg, #e8dcc8 0%, #ddd0b8 30%, #e2d5bf 60%, #d8cbb2 100%);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1;
        }

        .save-card {
            background: #fdf8f0;
            border: 2px solid #3a3020;
            border-radius: 8px 2px 8px 2px;
            padding: 48px 60px;
            text-align: center;
            box-shadow: 4px 4px 0 rgba(40,35,30,0.15);
            max-width: 480px;
            opacity: 0;
            transform: translateY(20px);
            animation: cardIn 1s ease forwards;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .save-card h2 {
            font-size: 22px;
            letter-spacing: 6px;
            color: #3a3020;
            margin-bottom: 20px;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
        }

        .save-card .line {
            width: 60px;
            height: 2px;
            background: #3a3020;
            margin: 0 auto 20px;
        }

        .save-card p {
            font-size: 14px;
            color: #5a5248;
            line-height: 2;
            margin-bottom: 8px;
            font-family: "FangSong", "STFangsong", "仿宋", serif;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .save-card p:nth-child(4) { animation-delay: 0.3s; }
        .save-card p:nth-child(5) { animation-delay: 0.6s; }
        .save-card p:nth-child(6) { animation-delay: 0.9s; }
        .save-card p:nth-child(7) { animation-delay: 1.2s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .save-card .next-chapter {
            display: inline-block;
            margin-top: 28px;
            font-size: 15px;
            color: #fdf8f0;
            letter-spacing: 3px;
            font-weight: 600;
            opacity: 0;
            animation: fadeIn 0.8s ease 1s forwards;
            background: rgba(90, 16, 16, 0.85);
            border: 1px solid rgba(139, 0, 0, 0.4);
            border-radius: 4px;
            padding: 12px 36px;
            text-decoration: none;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            transition: background 0.3s ease;
        }

        .save-card .next-chapter:hover {
            background: rgba(120, 20, 20, 0.95);
        }
    </style>
</head>
<body>
    <div class="scene-save">
        <div class="save-card">
            <h2>口 业 · 终</h2>
            <div class="line"></div>
            <p>有些话一旦说出口，就会自己长脚跑。</p>
            <p>现在它们跑回来了，带着L的脸，</p>
            <p>带着我的声音，带着水房隔间里</p>
            <p>那些没有压低的声音，一起跑回来了。</p>
            <a href="./preview.html" class="next-chapter">逐日塔迷雾：敬请期待</a>
        </div>
    </div>
</body>
</html>
