<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口业 · 日记</title>
    <style>
        @font-face {
            font-family: '新愚公峥嵘体';
            src: url('./fonts/xinyugongzhengrongti.ttf') format('truetype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .scene-diary {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            background: linear-gradient(170deg, #e8dcc8 0%, #ddd0b8 30%, #e2d5bf 60%, #d8cbb2 100%);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1;
        }

        .diary-book {
            width: 480px;
            height: 640px;
            background: #fdf8f0;
            border-radius: 4px 12px 12px 4px;
            box-shadow: 8px 8px 30px rgba(0,0,0,0.15);
            padding: 60px 50px;
            position: relative;
            overflow: hidden;
        }

        .diary-book::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0; bottom: 0;
            width: 1px;
            background: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(180,50,30,0.08) 20px, rgba(180,50,30,0.08) 21px);
        }

        .diary-page {
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            font-size: 16px;
            line-height: 2.4;
            color: #3a3020;
        }

        .diary-page .date-line {
            font-size: 14px;
            color: #8a7a60;
            margin-bottom: 20px;
            text-align: right;
        }

        .diary-page p {
            text-indent: 2em;
            margin-bottom: 12px;
        }

        .threat-text {
            font-family: '新愚公峥嵘体', "KaiTi", "STKaiti", "楷体", serif;
            font-size: 22px;
            line-height: 2.2;
            color: #5a1010;
            text-align: center;
            margin-top: 40px;
        }

        .threat-text .char {
            opacity: 0;
            display: inline-block;
            position: relative;
        }

        .threat-text .char.show {
            opacity: 1;
            animation: bloodDrip 0.6s ease forwards;
        }

        @keyframes bloodDrip {
            0% { transform: translateY(-5px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .blood-seep {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s ease;
            background:
                radial-gradient(ellipse 200px 300px at 20% 40%, rgba(139,0,0,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 250px 350px at 80% 60%, rgba(120,0,0,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 180px 280px at 50% 80%, rgba(139,0,0,0.1) 0%, transparent 60%);
        }

        .blood-seep.active {
            opacity: 1;
        }

        .next-link {
            display: inline-block;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #fdf8f0;
            font-size: 14px;
            letter-spacing: 3px;
            opacity: 0.15;
            transition: opacity 1s ease, background 0.3s ease;
            text-decoration: none;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            background: rgba(90, 16, 16, 0.85);
            border: 1px solid rgba(139, 0, 0, 0.4);
            border-radius: 4px;
            padding: 12px 32px;
            cursor: default;
            pointer-events: none;
        }

        .next-link.visible {
            opacity: 1;
            cursor: pointer;
            pointer-events: auto;
        }

        .next-link:hover {
            background: rgba(120, 20, 20, 0.95);
        }
    </style>
</head>
<body>
    <div class="scene-diary" id="sceneDiary">
        <div class="diary-book" id="diaryBook">
            <div class="blood-seep" id="bloodSeep"></div>
            <div class="diary-page" id="diaryPage"></div>
        </div>
    </div>
    <a href="./tower.html" class="next-link" id="nextLink">点击前往逐日塔</a>

    <script>
    var diaryPage = document.getElementById('diaryPage');
    var bloodSeep = document.getElementById('bloodSeep');
    var nextLink = document.getElementById('nextLink');

    var diaryContent = [
        { type: 'date', text: '1998年11月7日  夜' },
        { type: 'p', text: '……' },
        { type: 'p', text: '我逃回宿舍，锁上门。桌上摊着日记本，我不记得自己打开过它。' },
        { type: 'threat', text: '你哥哥发现了疗养院的秘密，所以他消失了。现在轮到你了。' }
    ];

    function startDiary() {
        var index = 0;

        function showNext() {
            if (index >= diaryContent.length) {
                setTimeout(function() {
                    nextLink.classList.add('visible');
                }, 800);
                return;
            }

            var item = diaryContent[index];

            if (item.type === 'threat') {
                showThreatText(item.text);
            } else {
                var el = document.createElement(item.type === 'date' ? 'div' : 'p');
                if (item.type === 'date') el.className = 'date-line';
                el.textContent = item.text;
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.8s ease';
                diaryPage.appendChild(el);
                requestAnimationFrame(function() {
                    el.style.opacity = '1';
                });
                index++;
                setTimeout(showNext, item.type === 'p' && item.text === '……' ? 1200 : 600);
            }
        }

        function showThreatText(text) {
            var container = document.createElement('div');
            container.className = 'threat-text';
            diaryPage.appendChild(container);

            var chars = text.split('');
            chars.forEach(function(ch, i) {
                var span = document.createElement('span');
                span.className = 'char';
                span.textContent = ch;
                container.appendChild(span);

                setTimeout(function() {
                    span.classList.add('show');
                }, i * 150);
            });

            setTimeout(function() {
                bloodSeep.classList.add('active');
            }, chars.length * 150 + 500);

            index++;
            setTimeout(showNext, chars.length * 150 + 5000);
        }

        setTimeout(showNext, 500);
    }

    startDiary();
    </script>
</body>
</html>
