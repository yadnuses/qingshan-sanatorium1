        var i = 0;
        var cursor = document.createElement('span');
        cursor.className = 'typewriter-cursor';
        typewriterText.appendChild(cursor);

        function typeNext() {
            if (i < text.length) {
                var span = document.createElement('span');
                span.className = 'char';
                span.textContent = text[i];
                span.style.animationDelay = '0s';
                typewriterText.insertBefore(span, cursor);
                i++;
                var delay = '，。'.indexOf(text[i - 1]) !== -1 ? 280 : 80;
                setTimeout(typeNext, delay);
            } else {
                cursor.style.display = 'none';
                typingDone = true;
                typewriterHint.classList.add('visible');

        '我看着那双眼睛，和高三晚自习时一模一样。那时候我痛经，她翻墙出去给我买暖宝宝。但现在，那里面有什么东西变了。',

    ];

    // 已读关键帖子追踪
    var readKeyPosts = new Set();
    var totalKeyPosts = 4;

    // ==================== 论坛列表 ====================
    var forumListContainer = document.getElementById('forumListContainer');

    function renderForumList() {
        forumListContainer.innerHTML = '';
        forumPosts.forEach(function(post) {
            var item = document.createElement('div');
            item.className = 'post-item';
            item.dataset.id = post.id;
            item.innerHTML =
                '<div class="post-title"><span class="post-tag ' + post.tag + '">' + post.tagName + '</span>' + post.title + '</div>' +
                '<div class="post-meta">' +
                '<span>' + post.author + '</span>' +
                '<span>' + post.time + '</span>' +
                '<span>浏览 ' + post.views + '</span>' +
                '<span>回复 ' + post.replies + '</span>' +
                '</div>';
            item.addEventListener('click', function() { openPost(post.id); });
            forumListContainer.appendChild(item);
        });
    }

    // ==================== 论坛帖子详情 ====================
    var postDetailBody = document.getElementById('postDetailBody');
    var postTitleSmall = document.getElementById('postTitleSmall');
    var forumHint = document.getElementById('forumHint');
    var currentPost = null;
    var floorIndex = 0;
    var postReading = false;

    function openPost(id) {
        currentPost = forumPosts.find(function(p) { return p.id === id; });
        if (!currentPost) return;

        postTitleSmall.textContent = currentPost.title;
        postDetailBody.innerHTML = '';
        floorIndex = 0;
        postReading = true;

        // 渲染楼主
        var master = document.createElement('div');
        master.className = 'floor-master';
        master.innerHTML =
            '<div class="floor-header">' +
            '<div class="floor-avatar">楼主</div>' +
            '<div class="floor-info"><div class="floor-name">' + currentPost.master.name + '</div><div class="floor-time">' + currentPost.master.time + '</div></div>' +
            '</div>' +
            '<div class="floor-content">' + currentPost.master.content + '</div>';
        postDetailBody.appendChild(master);

        switchScene('forumList', 'forumPost');
        forumHint.classList.add('visible');
    }

    function nextFloor() {
        if (!currentPost || floorIndex >= currentPost.floors.length) {
            // 帖子读完
            forumHint.classList.remove('visible');
            postReading = false;
            setTimeout(function() {
                if (currentPost.keyPost && typeof currentPost.segmentIndex === 'number') {
                    readKeyPosts.add(currentPost.id);
                    switchScene('forumPost', 'typewriter');
                    if (readKeyPosts.size >= totalKeyPosts) {
                        runConfrontationSegments();
                    } else {
                        runTypewriter(typewriterSegments[currentPost.segmentIndex], function() {
                            scenes.typewriter.addEventListener('click', returnToForum, { once: true });
                        });
                    }
                } else {
                    // 无关帖子，直接返回列表
                    switchScene('forumPost', 'forumList');
                }
            }, 600);
            return;
        }

        var floor = currentPost.floors[floorIndex];
        var el = document.createElement('div');
        el.className = 'floor-reply';
        el.innerHTML =
            '<div class="floor-header">' +
            '<div class="floor-avatar">' + floor.num.charAt(0) + '</div>' +
            '<div class="floor-info"><div class="floor-name">' + floor.name + '</div></div>' +
            '<div class="floor-num">' + floor.num + '</div>' +
            '</div>' +
            '<div class="floor-content">' + floor.content + '</div>';
        postDetailBody.appendChild(el);
        floorIndex++;

        requestAnimationFrame(function() {
            el.classList.add('show');
            postDetailBody.scrollTop = postDetailBody.scrollHeight;
        });
    }

    function returnToForum() {
        if (!typingDone) return;
        switchScene('typewriter', 'forumList');
    }

    function goToRumors() {
        if (!typingDone) return;
        switchScene('typewriter', 'rumors');
        startRumors();
    }

    function runConfrontationSegments() {
        var segIndex = 0;

        function showNext() {
            if (segIndex >= confrontationSegments.length) {
                // 最后一段打完，等待点击进入rumors
                scenes.typewriter.addEventListener('click', function handler() {
                    if (!typingDone) return;
                    scenes.typewriter.removeEventListener('click', handler);
                    goToRumors();
                });
                return;
            }

            typewriterText.innerHTML = '';
            runTypewriter(confrontationSegments[segIndex], function() {
                // 第4段（最后一段）触发血效果
                if (segIndex === 3) {
                    document.getElementById('bloodSpread').classList.add('active');
                    document.getElementById('bloodDrop1').classList.add('active');
                    document.getElementById('bloodDrop2').classList.add('active');
                    document.getElementById('bloodDrop3').classList.add('active');
                    document.getElementById('bloodDrop4').classList.add('active');
                    document.getElementById('bloodDrop5').classList.add('active');
                }
                segIndex++;
                scenes.typewriter.addEventListener('click', function handler() {
                    if (!typingDone) return;
                    scenes.typewriter.removeEventListener('click', handler);
                    showNext();
                });
            });
        }

        showNext();
    }

    scenes.forumPost.addEventListener('click', function() {
        if (!postReading) return;
        nextFloor();
    });

    document.getElementById('postBack').addEventListener('click', function() {
        switchScene('forumPost', 'forumList');
        postReading = false;
    });

    // ==================== 第一幕：开场打字机 ====================
    var openingText1 = '开学后，我搬回了青山大学的宿舍。室友们小心翼翼地避开周明远的话题，仿佛周明远的名字是一个需要消音的敏感词。只有L不一样。她在别人提起周明远的时候，会直视对方的眼睛，说，不要再谈这个名字了。她是唯一一个敢替我挡箭的人。我感激她。';
    var openingText2 = '我感激到没有注意到，那些她替我说出口的话，后来都成了她的筹码...';

    runTypewriter(openingText1, function() {
        scenes.typewriter.addEventListener('click', function() {
            if (!typingDone) return;
            typewriterText.innerHTML = '';
            runTypewriter(openingText2, function() {
                scenes.typewriter.addEventListener('click', function() {
                    if (!typingDone) return;
                    switchScene('typewriter', 'forumList');
                    renderForumList();
                }, { once: true });
            });
        }, { once: true });
    });

    // ==================== L崩溃：全屏谣言铺满 ====================
    var rumorTexts = [
        '她当小三',
        '她辱骂老师',
        '她勾引学长',
        '她硬插进去',
        '她不知廉耻',
        '她活该'
    ];

    function startRumors() {
        var container = scenes.rumors;
        var placed = [];

        function placeText(text, delay) {
            setTimeout(function() {
                var span = document.createElement('div');
                span.className = 'rumor-text';
                span.textContent = text;

                var x, y, tries = 0;
                do {
                    x = 5 + Math.random() * 70;
                    y = 5 + Math.random() * 70;
                    tries++;
                } while (tries < 50 && placed.some(function(p) {
                    return Math.abs(p.x - x) < 25 && Math.abs(p.y - y) < 15;
                }));

                placed.push({ x: x, y: y });
                span.style.left = x + '%';
                span.style.top = y + '%';
                span.style.transform = 'rotate(' + (Math.random() * 20 - 10) + 'deg)';
                container.appendChild(span);

                requestAnimationFrame(function() {
                    span.classList.add('show');
                });

                container.classList.remove('shake');
                void container.offsetWidth;
                container.classList.add('shake');
            }, delay);
        }

        rumorTexts.forEach(function(text, i) {
            placeText(text, i * 600);
        });

        setTimeout(function() {
            window.location.href = './diary.html';
        }, rumorTexts.length * 600 + 3000);
    }
